{% extends 'gestion/base.html' %}
{% block content %}
<a href="{% url 'crear_empleado' %}" class="btn">Registrar Nuevo Empleado</a>
<h2>Empleados</h2>
<table>
    <tr>
        <th>Nombre</th>
        <th>Cargo</th>
        <th>Teléfono</th>
        <th>Acciones</th>
    </tr>
    {% for empleado in empleados %}
    <tr>
        <td>{{ empleado.nombre }}</td>
        <td>{{ empleado.cargo }}</td>
        <td>{{ empleado.telefono }}</td>
        <td>
            <a href="{% url 'editar_empleado' empleado.id %}" class="btn-editar">Editar</a>
            <a href="{% url 'eliminar_empleado' empleado.id %}" class="btn-eliminar">Eliminar</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
