{% extends 'gestion/base.html' %}
{% block content %}
<a href="{% url 'crear_mesa' %}" class="btn">Registrar Nueva Mesa</a>
<h2>Mesas</h2>
<table>
    <tr>
        <th>ID</th>
        <th>Número</th>
        <th>Capacidad</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>
    {% for mesa in mesas %}
    <tr>
        <td>{{ mesa.id }}</td>
        <td>{{ mesa.numero_mesa }}</td>
        <td>{{ mesa.capacidad }}</td>
        <td>{{ mesa.estado_mesa }}</td>
        <td>
            <a href="{% url 'editar_mesa' mesa.id %}" class="btn-editar">Editar</a>
            <a href="{% url 'eliminar_mesa' mesa.id %}" class="btn-eliminar">Eliminar</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
